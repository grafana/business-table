# Git hooks. Install once with `npm run hooks:install`.
#
# This repo sets `ignore-scripts=true` in .npmrc as supply-chain hardening, which also blocks
# lefthook's own postinstall - so hooks are NOT wired up automatically by `npm ci`. The install
# step is explicit and must be run once per clone.
#
# Every job runs on every commit. Deliberately not scoped by `glob`: a dependency or config
# change with no staged `.ts` file can still break types or tests, so narrowing by file
# extension would let exactly that class of breakage through. Jobs run in parallel, so wall
# time is the slowest one (test:ci, ~10s) rather than the sum.
#
# Bypass in a pinch with `git commit --no-verify`.

pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: npm run lint

    - name: typecheck
      run: npm run typecheck

    - name: test
      run: npm run test:ci

    # Guards the CD changelog gate: no [Unreleased] heading, and the newest release matches
    # package.json.
    - name: changelog
      run: npm run changelog:check

    # Resolves reusable workflows at their pinned refs and checks inputs and transitive action
    # pins against the repo's allowed-actions policy. Catches `startup_failure` before dispatch.
    # Skips itself when offline.
    - name: preflight
      run: npm run preflight
